[project]
name = "telegram-triage-bot"
version = "0.1.0"
description = "Telegram bot for mobile review of AI-triaged correspondence"
requires-python = ">=3.12"
dependencies = [
    "anthropic[mcp]>=0.47.0",
    "mcp>=1.0.0",
    "python-telegram-bot>=21.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "tenacity>=9.0",
    "pyotp>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyright>=1.1.371",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_triage_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires live external services (Gmail OAuth, Anthropic API) — run with pytest -m integration",
    "smoke: fast app-wiring and import sanity checks",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
