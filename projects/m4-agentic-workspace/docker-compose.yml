services:
  n8n:
    image: n8nio/n8n:1.88.0
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ${GRANOLA_SYNC_PATH}:/granola-sync:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agentic

  qdrant:
    image: qdrant/qdrant:v1.14.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - agentic

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.6.5
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - open_webui_data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agentic

  obsidian-mcp:
    build:
      context: ../obsidian-mcp
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - VAULT_PATH=/vault
      - MCP_API_KEY=${MCP_API_KEY}
      - NODE_ENV=production
    volumes:
      - ./vault:/vault
    networks:
      - agentic

  agent-host:
    build:
      context: ./agent-host
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_TRIAGE_MODEL=${OLLAMA_TRIAGE_MODEL:-gemma3:9b}
      - OLLAMA_REASONING_MODEL=${OLLAMA_REASONING_MODEL:-qwen2.5:32b}
      - VAULT_PATH=/vault
      - QDRANT_URL=http://qdrant:6333
      - OBSIDIAN_MCP_URL=${OBSIDIAN_MCP_URL:-http://obsidian-mcp:3001}
      - MCP_API_KEY=${MCP_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./vault:/vault
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
      - obsidian-mcp
    networks:
      - agentic

volumes:
  n8n_data:
  qdrant_data:
  open_webui_data:

networks:
  agentic:
    driver: bridge
