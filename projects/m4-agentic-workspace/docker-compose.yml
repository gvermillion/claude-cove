services:
  n8n:
    image: n8nio/n8n:1.121.0
    ports:
      - "5678:5678"
    depends_on:
      agent-host:
        condition: service_healthy
    environment:
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - DB_SQLITE_POOL_SIZE=4
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ${GRANOLA_SYNC_PATH}:/granola-sync:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agentic

  qdrant:
    image: qdrant/qdrant:v1.14.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - agentic

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.6.5
    ports:
      - "3009:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - open_webui_data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agentic

  phoenix:
    image: arizephoenix/phoenix:version-14.8.0
    ports:
      - "6006:6006"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - phoenix_data:/root/.phoenix
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6006/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - agentic

  obsidian-mcp:
    build:
      context: ../obsidian-mcp
      dockerfile: Dockerfile
    ports:
      - "3004:3000"
    environment:
      - VAULT_PATH=/vault
      - MCP_API_KEY=${MCP_API_KEY}
      - NODE_ENV=production
    volumes:
      - ./vault:/vault
    networks:
      - agentic

  agent-host:
    build:
      context: ./agent-host
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - VAULT_PATH=/vault
      - QDRANT_URL=http://qdrant:6333
      - OBSIDIAN_MCP_URL=${OBSIDIAN_MCP_URL:-http://obsidian-mcp:3000}
      - MCP_API_KEY=${MCP_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    volumes:
      - ./vault:/vault
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
      obsidian-mcp:
        condition: service_healthy
      phoenix:
        condition: service_healthy
    networks:
      - agentic

volumes:
  n8n_data:
  qdrant_data:
  open_webui_data:
  phoenix_data:

networks:
  agentic:
    driver: bridge
