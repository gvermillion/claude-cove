# Nginx reverse proxy configuration for obsidian-mcp
# Domain: mcp.vermillion.pro
# TLS certificates managed by Certbot / Let's Encrypt

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mcp.vermillion.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server — terminates TLS and proxies to the MCP container
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.vermillion.pro;

    # ── TLS certificates (Let's Encrypt via certbot) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/mcp.vermillion.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.vermillion.pro/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # HSTS — tell clients to always use HTTPS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # ── Health endpoint ───────────────────────────────────────────────────────
    location /health {
        proxy_pass http://mcp:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SSE endpoint — requires special proxy settings for streaming ──────────
    location /sse {
        proxy_pass http://mcp:3000/sse;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward the Authorization header so auth middleware receives it
        proxy_set_header Authorization $http_authorization;

        # SSE requires these settings to prevent buffering breaking the stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;  # 24 hours — keep long-lived SSE connections alive
        proxy_send_timeout 86400s;

        # Tell nginx not to buffer the SSE response
        add_header X-Accel-Buffering no always;

        # SSE uses keep-alive connections
        proxy_set_header Connection keep-alive;
        keepalive_timeout 86400s;
    }

    # ── MCP message POST endpoint ─────────────────────────────────────────────
    location /messages {
        proxy_pass http://mcp:3000/messages;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # ── Default — block everything else ──────────────────────────────────────
    location / {
        return 404;
    }
}
