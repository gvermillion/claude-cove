# obsidian-mcp location blocks — include inside your vermillion.world server { } block.
#
# Add this line inside the relevant server { } block in your nginx config:
#
#   include /etc/nginx/snippets/obsidian-mcp.conf;
#
# The MCP container must be running on localhost:3000 before nginx will serve traffic.

# Streamable HTTP transport — Claude Code (type: "http", url: .../mcp)
location /mcp {
    proxy_pass         http://localhost:3000/mcp;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Authorization     $http_authorization;

    # Pass through MCP session header
    proxy_set_header   Mcp-Session-Id    $http_mcp_session_id;

    # Disable buffering — responses may be streamed
    proxy_buffering        off;
    proxy_cache            off;
    add_header             X-Accel-Buffering no always;
    proxy_read_timeout     86400s;
    proxy_send_timeout     86400s;

    client_max_body_size  1m;
}

location /mcp/health {
    proxy_pass         http://localhost:3000/health;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# SSE endpoint — long-lived streaming connection; buffering must be disabled.
location /mcp/sse {
    proxy_pass         http://localhost:3000/sse;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Authorization     $http_authorization;

    # Disable all buffering — SSE requires bytes to flush immediately.
    proxy_buffering        off;
    proxy_cache            off;
    add_header             X-Accel-Buffering no always;

    # Keep the connection open for up to 24 hours.
    proxy_read_timeout     86400s;
    proxy_send_timeout     86400s;
    proxy_set_header       Connection keep-alive;
    keepalive_timeout      86400s;
}

# Message POST endpoint — clients send JSON-RPC requests here.
location /mcp/messages {
    proxy_pass         http://localhost:3000/messages;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Authorization     $http_authorization;

    proxy_read_timeout    30s;
    client_max_body_size  1m;
}
