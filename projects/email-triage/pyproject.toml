[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-triage"
version = "0.1.0"
description = "Encrypted email triage system: pull-based relay with AI classification agent"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    # Core
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",

    # HTTP and retry
    "httpx>=0.27.0",
    "tenacity>=8.3.0",

    # Email
    "imapclient>=3.0.1",

    # GPG
    "python-gnupg>=0.5.2",

    # AI
    "anthropic>=0.28.0",

    # File watching
    "watchdog>=4.0.1",

    # Serialization
    "orjson>=3.10.3",

    # CLI
    "typer>=0.12.3",
]

[project.scripts]
email-triage-relay = "email_triage.entrypoints.relay:app"
email-triage-agent = "email_triage.entrypoints.agent:app"

[tool.hatch.build.targets.wheel]
packages = ["src/email_triage"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.5.1",
    "respx>=0.21.1",
    "pyright>=1.1.371",
    "ruff>=0.4.10",
    "pre-commit>=3.7.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "RET", "SIM", "TID"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: marks tests requiring external services",
    "unit: marks fast isolated unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/email_triage/entrypoints/*"]

[tool.coverage.report]
fail_under = 80
